<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .offline-box {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: #1e1e1e;
      border-radius: 10px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #ccc;
      line-height: 1.5;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #28a745;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="offline-box">
    <h1>You are offline</h1>

    <p>
      Please check your internet connection and try again.
    </p>

    <button onclick="location.reload()">
      Try Again
    </button>
  </div>

</body>
</html>
